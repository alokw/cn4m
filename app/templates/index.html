<html>
<head>
    <title>outbox cn4m</title>  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="{{ url_for('static', filename='jquery2.1.3.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='cn4m.js') }}"></script>

    <link href="{{ url_for('static', filename='bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='cn4m.css') }}" rel="stylesheet">

    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='logos/apple-touch-icon.png') }}">
	<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='logos/favicon-32x32.png') }}">
	<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='logos/favicon-16x16.png') }}">

</head>
<body>

	<div class="container p-3">
    	<img class="" src="{{ url_for('static', filename='logos/cn4m_logo_white_v1_64px.png') }}">
	</div>

    <div class="container rounded-3 px-4 py-3 mb-3 bg-darkish border-darkish">
        <div class="pb-2 text-uppercase fw-semibold obx-orange">1. check assets</div>
        <div class="row">
            <div class="col-md-auto">
                <button id="check-assets" class="obx-button">START</button>
            </div>
            <div class="col fs-7 lh-sm">
                <span>Scans for and checks newly added assets in the repository.</span><br />
                <span class="fw-lighter" id="check_asset_progress">Press <i>Start</i> to Begin.</span>
            </div>
        </div>
    </div>

    <div class="container rounded-3 px-4 py-3 mb-3 bg-darkish border-darkish">
        <div class="d-flex justify-content-between align-items-center pb-2">
            <div class="text-uppercase fw-semibold obx-orange">2. review assets</div>
            <div class="review-buttons" style="display:none; margin-left:auto;">
                <button id="select-audio" class="obx-button">SELECT ALL AUDIO</button>
                <button id="deselect-audio" class="obx-button" style="margin-left:0.5rem;">DE-SELECT ALL AUDIO</button>
            </div>
        </div>
        <div id="results"></div>
        <div id="review-actions" style="display:none;">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <button id="quarantine-assets" class="obx-button">QUARANTINE SELECTED</button>
                    <button id="approve-assets" class="obx-button">APPROVE SELECTED</button>
                </div>
                <div>
                    <select id="ffmpeg-preset-select" class="obx-select">
                        <option value="">Select preset...</option>
                    </select>
                    <button id="transcode-assets" class="obx-button">TRANSCODE</button>
                    <button id="quarantine-transcode-assets" class="obx-button">QUARANTINE & TRANSCODE</button>
                </div>
            </div>
        </div>
        <div class="pt-2"><span class="fw-lighter fs-7" id="review_asset_flags"></span></div>
        <div class="pt-2"><span class="fw-lighter fs-7" id="review_asset_progress"></span></div>
    </div>

    <div class="container rounded-3 px-4 py-3 mb-3 bg-darkish border-darkish">
        <div class="pb-2 text-uppercase fw-semibold obx-orange">3. track assets</div>
        <button id="track-assets" class="obx-button">UPDATE GOOGLE SHEET</button><br />
        <div class="pt-2"><span class="fw-lighter fs-7" id="track_assets_progress"></span></div>
    </div>

<script>

//$(function() { $('#select-all').click(select_all); });
//$(function() { $('#unselect-all').click(unselect_all); });
$(function() { $('#check-assets').click(check_assets); });
$(function() { $('#approve-assets').click(approve_assets); });
$(function() { $('#quarantine-assets').click(quarantine_assets); });
$(function() { $('#track-assets').click(track_assets); });
$(function() { $('#transcode-assets').click(transcode_assets); });
$(function() { $('#quarantine-transcode-assets').click(quarantine_and_transcode); });
$(function() { $('#select-audio').click(select_all_audio); });
$(function() { $('#deselect-audio').click(deselect_all_audio); });
$(load_ffmpeg_presets);
$(load_qc_config);

</script>
</body>
</html>
