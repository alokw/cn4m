# cn4m — mpv settings for playing high-bitrate originals over HTTP
#
# Where it goes:
#   Windows   %APPDATA%\mpv\mpv.conf            (C:\Users\<you>\AppData\Roaming\mpv\mpv.conf)
#             — or a portable_config\ folder next to mpv.exe, to keep it with the player
#   Linux     ~/.config/mpv/mpv.conf
#   macOS     not needed; IINA ships with generous cache settings of its own
#
# Why: stock mpv assumes a network stream is a few Mbit/s. A ProRes or NotchLC
# original off the cn4m files server is a few hundred MB/s, and mpv's default
# readahead of 150 MiB holds under a second of it — so playback drains the
# buffer, pauses to refill, plays, drains: a stall every couple of seconds.
# Nothing below changes what is decoded or how it looks; it only gives the
# reader room. Memory is used as needed, not reserved up front.

# Read ahead up to 2 GiB (roughly ten seconds of the heaviest ProRes 4444 4K,
# a minute of 1080p) and keep 256 MiB behind the playhead for short seeks back.
cache=yes
demuxer-max-bytes=2GiB
demuxer-max-back-bytes=256MiB

# Once the readahead limit is reached, let it drain to eight seconds of
# runway before filling again — fewer, larger reads instead of a trickle.
demuxer-hysteresis-secs=8

# The low-level buffer between the socket and the demuxer (default 128 KiB).
# The mpv manual singles out mp4/mov over a network as the case where a large
# one helps: libavformat issues many small seeks on these containers.
stream-buffer-size=64MiB

# Fill the buffer before starting rather than starting and stalling at once,
# and if it does stall, wait for four seconds of data (default: one) so it
# doesn't stutter back in.
cache-pause-initial=yes
cache-pause-wait=4

# Hardware decoding where the codec allows it (H.264 / HEVC deliverables).
# ProRes, NotchLC and Hap are decoded in software whichever way this is set.
hwdec=auto-safe
