services:
  web:
    build: .
    container_name: flask_app
    ports:
      - "5000:5000"  # Map Flask's port to the host
    depends_on:
      - redis
      - worker
    volumes:
      - .:/app  # Sync local files with container (useful for development)
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
      - FLASK_RUN_HOST=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/0
    #  - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - settings.env
    # command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--reload"]

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis_server
    ports:
      - "6379:6379"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  worker:
    build: .
    container_name: celery_worker
    depends_on:
      - redis
    volumes:
      - .:/app
      - M:\usta25:/cn4m_assets
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    #  - /Users/outbox/Desktop/cn4m_assets:/cn4m_assets
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/0
    #  - CELERY_RESULT_BACKEND=redis://redis:6379/0
    #command: ["celery", "-A", "app:celery", "worker", "--loglevel=info"]
    command: ["/bin/sh", "-c", "watchmedo auto-restart --recursive --pattern=*.py -- celery -A app:celery worker --loglevel=info --uid=nobody"]


  flower:  # Celery monitoring UI
    image: mher/flower
    container_name: flower_monitor
    depends_on:
      - redis
      - worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro