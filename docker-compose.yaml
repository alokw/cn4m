services:
  web:
    build: .
    container_name: flask_app
    ports:
      # Suite port allocation — see "The cn4m suite" in the README.
      - "2640:2640"  # cn4m web GUI
    depends_on:
      - redis
      - worker
    volumes:
      - .:/app  # Sync local files with container (useful for development)
      # The browse tabs (/assets/repo, /assets/quarantine, /untracked_count)
      # read assets.json directly, so the web server needs the workspace too.
      # Read-only on purpose: every mutation goes through a Celery task in the
      # worker, so the web container never has cause to write here.
      - ${WORKSPACE_FOLDER}:/cn4m_assets:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - WORKSPACE_FOLDER=${WORKSPACE_FOLDER}
      - FLASK_APP=run.py
      - FLASK_RUN_HOST=0.0.0.0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/0
      - TZ=${TZ}
    command: ["flask", "run", "--host=0.0.0.0", "--port=2640", "--reload"]

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis_server
    ports:
      # Host-side only, for inspecting Redis from outside the container. The
      # other services reach it over the Docker network on 6379 regardless.
      - "2642:6379"  # cn4m message broker
    environment:
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  worker:
    build: .
    container_name: celery_worker
    depends_on:
      - redis
    volumes:
      - .:/app
      # Single bind mount so 'repo' and 'quarantine' live on the same filesystem
      # inside the container. This lets quarantine be a fast metadata-only rename
      # instead of a full byte copy across mounts.
      - ${WORKSPACE_FOLDER}:/cn4m_assets
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - WORKSPACE_FOLDER=${WORKSPACE_FOLDER}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - RESULT_BACKEND=redis://redis:6379/0
      - TZ=${TZ}
      # The worker must create transcode outputs and move files throughout the
      # delivery tree, which arrives owned by root (via the Windows bind mount).
      # Running as root is the only durable way to write into those folders, so
      # C_FORCE_ROOT lifts Celery's default refusal to run as the root user.
      - C_FORCE_ROOT=1
    # watchmedo restarts the worker whenever a .py file changes (hot reload)
    command: ["/bin/sh", "-c", "watchmedo auto-restart --recursive --pattern=*.py -- celery -A app:celery worker --loglevel=info"]

  flower:  # Celery monitoring UI
    image: mher/flower
    container_name: flower_monitor
    depends_on:
      - redis
      - worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - TZ=${TZ}
    ports:
      - "2641:5555"  # cn4m task monitor
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
