# ffmpeg_config.yaml
#
# FFmpeg command presets for the cn4m asset conformance tool.
# Each preset defines an ffmpeg operation that can be triggered from the web UI.
#
# HOW TO ADD A NEW PRESET
# ──────────────────────
# 1. Copy an existing preset block (everything from "- name:" down to its last option).
# 2. Paste it below the last preset.
# 3. Fill in the fields:
#      name        — short identifier used in the web app (no spaces, use underscores)
#      label       — human-readable name shown on buttons/menus
#      description — one-line explanation of what this preset does
#      inputs      — list of ffmpeg input definitions
#      outputs     — list of ffmpeg output definitions
#      global_args — optional list of extra ffmpeg flags (e.g. mapping)
#
# FIELD REFERENCE
# ───────────────
#   Config values may contain {field} tokens that are substituted at runtime:
#     - Project-level values (from config/project_config.yaml) are checked first
#       e.g. {framerate} resolves to the project's target framerate
#     - Per-asset metadata fields are available as fallback
#       e.g. {width}, {height}, {video_codec}, {audio_rate}, etc.
#     - {source_framerate} is the special case: it always resolves to the source
#       file's own framerate, ignoring the project target. If the source has no
#       video track (a .wav, say) it falls back to the project framerate.
#
#   inputs:
#     - file:       path or ffmpeg source string (e.g. "color=c=black:s=16x16" for synthetic inputs)
#       format:     optional input format flag (e.g. "lavfi" for libavfilter virtual inputs)
#
#   outputs:
#     - suffix:     string appended to the original filename stem
#                   e.g. stem="my_clip", suffix="_hapaudio" → "my_clip_hapaudio.mov"
#       extension:  output file extension (e.g. "mov", "mp4", "wav")
#       map:        optional list selecting which input stream feeds the output,
#                   as "INPUT:STREAM" entries (e.g. "0:v" = video from input 0,
#                   "1:a" = audio from input 1). REQUIRED whenever a preset has
#                   more than one input, otherwise ffmpeg pulls every stream from
#                   every input (e.g. the source's full-res video sneaks in).
#                   Omit for single-input presets to use ffmpeg's default mapping.
#       options:    key:value pairs passed as ffmpeg output options
#                   keys are ffmpeg option names; values are strings or null (for flags)
#
#   global_args:
#     - optional list of extra global ffmpeg arguments (rarely needed).
#       NOTE: do NOT put "-map" here — use the 'map' field above; global args are
#       placed after the output filename, where -map has no effect.
#
# TIPS
# ────
# - Use "# " at the start of a line to add a comment (like this one).
# - Indentation matters — use spaces, not tabs.
# - Boolean / flag-style ffmpeg options should use null as the value (see "shortest" below).
# - If a preset only needs one input, just list one under "inputs".


presets:

  # ── Transcode Video to HAP ───────────────────────────────────────────────────
  # Re-encodes a video file to HAP with stereo PCM audio, keeping the picture.

  - name: transcode_hap
    label: "Transcode Video to HAP"
    description: "Creates a HAP-encoded .mov from the existing file."
    inputs:
      - file: null                        # null means "use the selected asset's file path"
    outputs:
      - suffix: "_hap"
        extension: "mov"
        options:
          vcodec: "hap"
          acodec: "pcm_s16le"
          format: "mov"
          vf: "fps={source_framerate}"
          ar: 48000
          ac: 2
    global_args: []
          
  - name: extract_hap_audio
    label: "Extract Audio to 16x16 HAP - Stereo"
    description: "Creates a HAP-encoded .mov from the file's audio track (16x16 black video)."
    inputs:
      - file: "color=c=black:s=16x16"
        format: "lavfi"
      - file: null                        # null means "use the selected asset's file path"
    outputs:
      - suffix: "_hapaudio"
        extension: "mov"
        map:                              # video from input 0 (16x16 black), audio from input 1 (the media file)
          - "0:v"
          - "1:a"
        options:
          vcodec: "hap"
          acodec: "pcm_s16le"
          format: "mov"
          vf: "fps={source_framerate}"
          ar: 48000
          shortest: null
    global_args: []

  - name: extract_hap_audio_left
    label: "Extract Audio to 16x16 HAP - Mono L (VO / Narration)"
    description: "Creates a HAP-encoded .mov from the file's audio track (16x16 black video)."
    inputs:
      - file: "color=c=black:s=16x16"
        format: "lavfi"
      - file: null                        # null means "use the selected asset's file path"
    outputs:
      - suffix: "_hapaudio"
        extension: "mov"
        map:                              # video from input 0 (16x16 black), audio from input 1 (the media file)
          - "0:v"
          - "1:a"
        options:
          vcodec: "hap"
          acodec: "pcm_s16le"
          format: "mov"
          vf: "fps={source_framerate}"
          ar: 48000
          af: "pan=stereo|c0=c0|c1=0*c0"
          shortest: null
    global_args: []

  - name: extract_hap_audio_right
    label: "Extract Audio to 16x16 HAP - Mono R (Dialogue)"
    description: "Creates a HAP-encoded .mov from the file's audio track (16x16 black video)."
    inputs:
      - file: "color=c=black:s=16x16"
        format: "lavfi"
      - file: null                        # null means "use the selected asset's file path"
    outputs:
      - suffix: "_hapaudio"
        extension: "mov"
        map:                              # video from input 0 (16x16 black), audio from input 1 (the media file)
          - "0:v"
          - "1:a"
        options:
          vcodec: "hap"
          acodec: "pcm_s16le"
          format: "mov"
          vf: "fps={source_framerate}"
          ar: 48000
          af: "pan=stereo|c0=0*c0|c1=c0"
          shortest: null
    global_args: []

  # ── Transcode to H.264 ────────────────────────────────────────────────────────
  # Creates a lightweight H.264 review proxy from any video file.

  - name: transcode_h264
    label: "Transcode to H.264"
    description: "Creates an H.264 MP4 review proxy at the original resolution."
    inputs:
      - file: null                        # uses the selected asset's file path
    outputs:
      - suffix: "_h264"
        extension: "mp4"
        options:
          vcodec: "libx264"
          vf: "fps={source_framerate}"
          crf: "23"
          preset: "medium"
          acodec: "aac"
          ar: 48000
          ac: 2
    global_args: []


  # ── Extract WAV Audio ─────────────────────────────────────────────────────────
  # Strips the audio track(s) into a standalone WAV file.

  - name: extract_wav
    label: "Extract WAV"
    description: "Exports audio as a 48kHz 16-bit stereo WAV file."
    inputs:
      - file: null
    outputs:
      - suffix: "_audio"
        extension: "wav"
        options:
          acodec: "pcm_s16le"
          ar: 48000
          ac: 2
          vn: null
    global_args: []



  # ── Convert Still to EXR (RLE) ────────────────────────────────────────────────
  # Converts a still image (png/jpg/tif/dpx/…) to a half-float RGBA OpenEXR with
  # RLE compression. Also safe to point at a video: it takes the first frame only.

  # ── Convert Still to EXR (uncompressed) ───────────────────────────────────────
  # Same as the RLE preset above, but stores the pixels uncompressed — larger on
  # disk (roughly 10x) in exchange for no decode cost on read.

  - name: convert_to_exr_none
    label: "Convert to EXR (no compression)"
    description: "Exports an uncompressed half-float RGBA OpenEXR still."
    inputs:
      - file: null
    outputs:
      - suffix: "_exr"
        extension: "exr"
        options:
          vcodec: "exr"
          # "format" is the EXR encoder's own option (half | float), NOT the
          # container format. It MUST be written with the ":v" stream specifier —
          # a bare "format" key is interpreted as ffmpeg's -f container flag.
          "format:v": "half"
          compression: "none"
          pix_fmt: "gbrapf32le"
          "frames:v": 1                   # one image out (first frame if given a video)
          update: 1                       # allow a single image to a plain (non-%04d) filename
          an: null                        # EXR holds no audio; drop any audio track
    global_args: []
